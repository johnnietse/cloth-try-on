services:
  - type: web
    name: virtual-try-on
    env: python
    region: virginia
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.10.13
    disk:
      name: app-data
      mountPath: /var/data
      sizeGB: 1